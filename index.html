<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upcoming Owls Livestreams</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #2e376c; /* fallback color if no background image is set */
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    #wrapper {
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
      background-image: url('bkd.jpg');
      background-size: cover;
      background-position: center;
    }

    /* ---- Info panel ---- */
    #panel {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .game-card {
      background: rgba(10, 14, 40, 0.55);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 28px 40px;
      color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    /* Next game gets emphasis */
    .game-card.next {
      padding: 36px 44px;
      border: 2px solid rgba(255,255,255,0.35);
      background: rgba(10, 14, 40, 0.7);
    }

    .game-tag {
      display: inline-block;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #4da6ff;
      margin-bottom: 10px;
    }

    .game-card.next .game-tag {
      color: #ffd24d;
    }

    .game-title {
      font-size: 34px;
      font-weight: 700;
      line-height: 1.25;
      margin: 0 0 10px 0;
    }

    .game-card.next .game-title {
      font-size: 46px;
    }

    .game-datetime {
      font-size: 24px;
      font-weight: 400;
      color: #e6e9f5;
    }

    .game-card.next .game-datetime {
      font-size: 28px;
      font-weight: 600;
    }

    #no-games {
      color: #fff;
      font-size: 32px;
      text-align: center;
      font-weight: 600;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="panel">
      <div id="games-container"></div>
    </div>
  </div>

  <script>
    // ---- CONFIG ----
    const CSV_URL = 'schedule.csv';
    const SCHEDULE_REFRESH_MS = 5 * 60 * 1000; // re-fetch CSV every 5 minutes
    const NUM_GAMES_TO_SHOW = 3;

    const container = document.getElementById('games-container');

    function scaleWrapper() {
      const scaleX = window.innerWidth / 1920;
      const scaleY = window.innerHeight / 1080;
      const scale = Math.min(scaleX, scaleY);
      document.getElementById('wrapper').style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', scaleWrapper);
    scaleWrapper();

    // ---- CSV parsing (handles quoted fields and empty fields correctly) ----
    function splitCSVLine(line) {
      const result = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          result.push(cur.trim());
          cur = '';
        } else {
          cur += char;
        }
      }
      result.push(cur.trim());
      return result;
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      const headers = splitCSVLine(lines[0]).map(h => h.toLowerCase());
      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const cells = splitCSVLine(lines[i]);
        const row = {};
        headers.forEach((h, idx) => { row[h] = cells[idx] || ''; });
        rows.push(row);
      }
      return rows;
    }

    function formatDateTime(d) {
      const datePart = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
      const timePart = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
      return `${datePart} · ${timePart}`;
    }

    function render(games) {
      container.innerHTML = '';

      if (!games.length) {
        container.innerHTML = '<div id="no-games">No Upcoming Livestreams Scheduled</div>';
        return;
      }

      games.forEach((game, idx) => {
        const card = document.createElement('div');
        card.className = 'game-card' + (idx === 0 ? ' next' : '');

        const tag = document.createElement('div');
        tag.className = 'game-tag';
        tag.textContent = idx === 0 ? 'Next Up' : `Upcoming`;
        card.appendChild(tag);

        const title = document.createElement('div');
        title.className = 'game-title';
        title.textContent = game.title;
        card.appendChild(title);

        const dt = document.createElement('div');
        dt.className = 'game-datetime';
        dt.textContent = formatDateTime(game.start);
        card.appendChild(dt);

        container.appendChild(card);
      });
    }

    async function loadSchedule() {
      try {
        const res = await fetch(`${CSV_URL}?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`CSV fetch failed: ${res.status}`);
        const text = await res.text();
        const rows = parseCSV(text);

        const now = new Date();
        const games = rows
          .filter(r => r.title && r.start)
          .map(r => ({ title: r.title.trim(), start: new Date(r.start.trim()) }))
          .filter(g => !isNaN(g.start.getTime()) && g.start > now)
          .sort((a, b) => a.start - b.start)
          .slice(0, NUM_GAMES_TO_SHOW);

        render(games);
      } catch (err) {
        console.error('Failed to load schedule.csv', err);
      }
    }

    loadSchedule();
    setInterval(loadSchedule, SCHEDULE_REFRESH_MS);
  </script>
</body>
</html>
